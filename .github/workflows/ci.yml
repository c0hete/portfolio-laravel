name: CI

# Pipeline CI/CD del portafolio (alvaradomazzei.cl).
# Adaptado del de crono. Filosofía: 4 jobs claros, sin magia.
# quality + security + secrets son GATES; deploy publica la versión nueva.
#
# - quality  : lint (Pint) + tests (PHPUnit sobre SQLite) + build de assets (Vite).
# - security : SCA de dependencias (composer audit + npm audit).
# - secrets  : escaneo de secretos (gitleaks) sobre código e historial.
# - deploy   : SSH al hub -> git pull rama main -> rebuild Docker -> migrate -> caches.
#              GUARD: arranca en modo manual (workflow_dispatch) hasta que los GitHub
#              Secrets estén cargados y validados. Ver documentacion/CICD.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1) CALIDAD — lint (Pint) + tests (PHPUnit sobre SQLite) + build de assets.
  #    phpunit.xml ya fija sqlite/:memory:, así que no hace falta service container.
  # ---------------------------------------------------------------------------
  quality:
    name: Lint + Tests + Build assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, gd, bcmath, intl, zip
          coverage: none
          tools: composer:v2

      - name: Cache de dependencias Composer
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias PHP (con dev, para Pint y PHPUnit)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno de test
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint de estilo — Laravel Pint (modo check, no modifica)
        run: ./vendor/bin/pint --test

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Instalar deps JS (lockfile congelado)
        run: npm ci

      # Build ANTES de los tests: las vistas usan @vite(), que necesita
      # public/build/manifest.json. Sin esto, GET / da 500 (manifest not found).
      - name: Build de assets (Vite) — valida que el frontend compila
        run: npm run build

      - name: Tests — PHPUnit
        run: php artisan test

  # ---------------------------------------------------------------------------
  # 2) SEGURIDAD — Software Composition Analysis (SCA).
  #    composer audit (PHP, lo que más muerde en Laravel) + npm audit (frontend).
  #    Política: CVE con fix sin romper la app -> se remedia, no se ignora.
  # ---------------------------------------------------------------------------
  security:
    name: SCA (audit de dependencias)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Auditar dependencias PHP — composer audit (sobre el lock)
        # --locked audita el composer.lock SIN instalar vendor/ (más rápido en CI).
        # Sin esto falla con "No installed packages found".
        run: composer audit --locked

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Auditar dependencias JS — npm audit (high+)
        # --package-lock-only audita el lockfile sin instalar node_modules (rápido en CI).
        run: npm audit --audit-level=high --package-lock-only

  # ---------------------------------------------------------------------------
  # 3) SECRETOS — gitleaks sobre código e historial. Gate: si alguien commitea
  #    una API key/token/credencial, el pipeline falla y bloquea merge/deploy.
  #    Complementa el hook local safe-code (cubre el server, no solo la máquina dev).
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 4) DEPLOY — publica la versión nueva sobre el hub (ya aprovisionado).
  #    Flujo Docker: git pull -> up -d --build -> migrate --force -> caches.
  #
  #    GUARD: hoy solo corre por disparo manual (workflow_dispatch). Para activar
  #    deploy automático en cada push a main, cambiar el `if` de abajo a:
  #        if: github.ref == 'refs/heads/main'
  #    (ver documentacion/CICD.md → "Activar el deploy automático").
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy al hub (Docker)
    runs-on: ubuntu-latest
    needs: [quality, security, secrets]
    # Auto-deploy: cada push a main que pase los 3 gates despliega a prod.
    # (También se puede disparar a mano con "Run workflow" / workflow_dispatch.)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Deploy vía SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "==> git pull main (descarta cambios de permisos, conserva commits)"
            git config core.fileMode false
            git fetch origin main
            git reset --hard origin/main
            echo "==> rebuild + up (el container corre el código COPY'd, no el del host)"
            docker compose -f docker-compose.prod.yml up -d --build
            echo "==> migrate (NUNCA migrate:fresh — hay proyectos reales)"
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
            echo "==> caches de producción (config + route; NO view)"
            docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan route:cache
            echo "==> deploy OK"
